name: Uppdatera matchdata

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta repo
        uses: actions/checkout@v4
      - name: Installera Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hämta riktiga match- och spelaruppgifter
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_SEASON: "2026"
          LOOKBACK_DAYS: "7"
          LOOKAHEAD_DAYS: "7"
        run: python scripts/fetch_matches.py
      - name: Publicera uppdaterad JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/matches.json
          if git diff --cached --quiet; then
            echo "Ingen ändring i matchdata."
          else
            git commit -m "Uppdatera matchdata"
            git push
          fi
