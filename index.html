<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BLÅSVARTA SPÅR | Resultat & Matchcenter</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --sirius-gold: #ffcc00;
            --live-green: #00e676;
            --rating-green: #10b981;
            --bg-black: #050914;
            --card-bg: #0c1632;
            --card-border: #1a2b55;
            --dropdown-bg: #112049;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-tap-highlight-color: transparent; 
        }

        html {
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
        }
        body {
            width: 100%;
            max-width: 100vw;
            overflow-x: clip;
            position: relative;
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--bg-black);
            background-image:
                radial-gradient(ellipse 90% 45% at 50% 0%, rgba(20, 70, 190, 0.38), transparent 70%);
            background-attachment: fixed;
            color: var(--text-main); 
            line-height: 1.4; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
        }
        html.modal-open, body.modal-open {
            overflow: hidden !important;
        }

        header { 
            background: #050d22; 
            border-bottom: 2px solid var(--sirius-gold); 
            position: -webkit-sticky;
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            width: 100%;
        }
        .header-container { 
            width: 100%;
            max-width: 1280px; 
            margin: 0 auto; 
            padding: 0.7rem 0.8rem; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            gap: 6px;
        }
        
        .brand-logo { display: flex; align-items: center; cursor: pointer; flex-shrink: 0; }
        .logo-svg { 
            height: 38px; 
            width: auto; 
            display: block; 
        }

        .nav-links { display: flex; gap: 4px; flex-shrink: 0; }
        .nav-btn { 
            background: #10204a; 
            border: 1px solid var(--card-border); 
            color: #fff; 
            padding: 9px clamp(8px, 2.6vw, 12px); 
            border-radius: 10px; 
            font-weight: 700; 
            cursor: pointer; 
            font-size: clamp(0.78rem, 3.4vw, 0.9rem); 
            display: flex; 
            align-items: center; 
            gap: 4px; 
            transition: 0.2s;
        }
        .nav-btn:hover, .nav-btn.active { background: #0044cc; border-color: #0055ff; }

        .dropdown { position: relative; display: inline-block; }
        .dropdown-menu { 
            display: none; 
            position: absolute; 
            top: 115%; 
            right: 0; 
            background-color: var(--dropdown-bg); 
            min-width: 180px; 
            box-shadow: 0px 8px 24px rgba(0,0,0,0.6); 
            border: 1px solid var(--card-border); 
            border-radius: 10px; 
            z-index: 1001; 
            padding: 6px 0; 
        }
        .dropdown.open .dropdown-menu { display: block; }
        .dropdown-item { 
            color: #fff; 
            padding: 10px 14px; 
            font-size: 0.8rem; 
            font-weight: 700; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        .dropdown-item:hover { background-color: #1b3170; }

        .date-picker-bar {
            background: #081230;
            border-bottom: 1px solid var(--card-border);
            padding: 0.5rem 0.4rem;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .date-picker-container { flex: 1; min-width: 0; display: flex; gap: 4px; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
        .date-item {
            flex: 1;
            min-width: 0;
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            font-family: inherit;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 7px 2px;
            border-radius: 14px;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
            transition: all 0.2s ease;
        }
        .date-item:hover { color: #fff; background: rgba(255, 255, 255, 0.05); }
        .date-item.active {
            color: #000;
            background: var(--sirius-gold);
            border-color: var(--sirius-gold);
            font-weight: 800;
        }
        .date-arrow {
            flex: 0 0 34px;
            height: 34px;
            background: transparent;
            border: 0;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .date-arrow:hover { background: rgba(255, 204, 0, 0.14); }
        .date-arrow svg { width: 20px; height: 20px; fill: var(--sirius-gold); }

        main { 
            width: 100%;
            max-width: 1280px; 
            margin: 0 auto; 
            padding: 0.8rem; 
            flex: 1; 
        }
        .section-header { 
            border-left: 3px solid var(--sirius-gold); 
            padding-left: 8px; 
            margin-bottom: 0.8rem; 
        }
        .section-header h2 { font-size: 1.1rem; font-weight: 900; letter-spacing: 0.3px; }
        .section-header p { color: var(--text-muted); font-size: 0.72rem; }
        
        .track-selector { 
            display: grid; 
            grid-template-columns: 1fr 1fr auto;
            gap: 8px; 
            margin-bottom: 1rem; 
            width: 100%;
        }
        .track-btn { 
            background: #0c1632; 
            border: 1px solid var(--card-border); 
            color: var(--text-muted); 
            padding: 9px 12px; 
            border-radius: 14px; 
            font-weight: 700; 
            font-size: 0.78rem; 
            cursor: pointer; 
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .track-btn-icon-only {
            padding: 9px 14px;
        }
        .track-btn:hover, .track-btn.active { background: #0044cc; color: #fff; border-color: #0055ff; }

        .custom-icon {
            width: 18px;
            height: 18px;
            display: inline-block;
            vertical-align: middle;
            flex-shrink: 0;
        }

        .matches-grid { display: grid; grid-template-columns: 1fr; gap: 0.8rem; width: 100%; }
        @media (min-width: 640px) {
            .matches-grid { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1rem; }

        .match-card { 
            background: var(--card-bg); 
            border: 1px solid var(--card-border); 
            border-radius: 12px; 
            padding: 0.8rem 0.9rem; 
            position: relative;

            width: 100%;

        .status-badge { 
            background: #10204a; 
            color: var(--sirius-gold); 
            font-weight: 800; 
            padding: 2px 8px; 
            border-radius: 10px; 
            border: none; 
            font-size: 0.65rem; 
        }

        .team-row { display: flex; justify-content: space-between; font-weight: 800; font-size: 0.9rem; margin-bottom: 5px; align-items: center; }
        .team-score { font-family: 'Roboto Mono', monospace; background: #050a1c; padding: 1px 7px; border-radius: 5px; border: 1px solid #1c2536; font-size: 0.95rem; }
        
        .player-footer { 
            border-top: 1px dashed #222d3d; 
            padding-top: 8px; 
            margin-top: 8px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .player-footer.clickable:hover {
            background: rgba(255, 204, 0, 0.05);
        }
        
        .player-info-group { display: flex; align-items: center; gap: 8px; }
        .player-thumb-wrapper { position: relative; }
        .player-thumb { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; background: #050a1c; border: 1px solid var(--sirius-gold); }
        .rating-badge { 
            position: absolute; 
            top: -3px; 
            right: -5px; 
            background: var(--rating-green); 
            color: #fff; 
            font-size: 0.6rem; 
            font-weight: 900; 
            padding: 1px 3px; 
            border-radius: 6px; 
            border: 1px solid #000;
        }
        .player-details h4 { color: var(--sirius-gold); font-weight: 800; font-size: 0.78rem; line-height: 1.1; }
        .player-quick-stats { text-align: right; font-size: 0.7rem; color: #fff; font-weight: 700; }
        .player-quick-stats span { color: var(--text-muted); font-weight: 400; font-size: 0.65rem; }

        .search-bar-inline {
            margin-bottom: 1rem;
            width: 100%;
        }
        .search-input { 
            width: 100%; 
            background: #081230; 
            color: #fff; 
            border: 1px solid var(--card-border); 
            border-radius: 12px; 
            padding: 0.85rem 1rem; 
            font: 600 16px 'Montserrat', sans-serif; 
            outline: none; 
        }
        .search-input:focus { border-color: var(--sirius-gold); }
        .search-input::placeholder { color: var(--text-muted); font-weight: 400; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 1rem 1rem 3rem;
            backdrop-filter: blur(4px);
        }
        @media (min-width: 640px) {
            .modal-overlay { padding: 1rem; }
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: #0a1330;
            border: 1px solid var(--card-border);
            border-radius: 20px;
            width: 100%;
            max-width: 440px;
            padding: 1.2rem;
            position: relative;
            box-shadow: 0 5px 25px rgba(0,0,0,0.8);
            max-height: 85vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        @media (min-width: 640px) {
            .modal-content { border-radius: 16px; }
        }
        .close-modal {
            position: absolute;
            top: 12px; right: 14px;
            background: #112049;
            border: none;
            color: var(--text-muted);
            width: 28px; height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex; align-items: center; justify-content: center;
        }

        .modal-player-header { text-align: center; margin-bottom: 1rem; }
        .modal-avatar-wrapper { position: relative; display: inline-block; margin-bottom: 6px; }
        .modal-avatar { width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--sirius-gold); object-fit: cover; background: #000; }
        .modal-rating-badge {
            position: absolute;
            bottom: -2px; right: -4px;
            background: var(--rating-green);
            color: #fff;
            font-size: 0.75rem;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 8px;
            border: 1px solid #000;
        }

        .modal-section-title {
            color: var(--sirius-gold);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 1rem 0 0.5rem 0;
            font-weight: 800;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 4px;
        }

        .modal-stats-list { background: #081230; border-radius: 10px; padding: 0.6rem; border: 1px solid var(--card-border); }
        .stat-item { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 0.78rem; }
        .stat-item:last-child { border-bottom: none; }
        .stat-item span { color: var(--text-muted); }
        .stat-item strong { color: #fff; font-weight: 700; }

        .nav-player-btn, .external-btn, .share-x-btn {
            width: 100%;
            margin-top: 0.8rem;
            padding: 10px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
            text-decoration: none;
            border: 1px solid var(--card-border);
        }
        .nav-player-btn { background: #112049; color: var(--sirius-gold); }
        .nav-player-btn:hover { background: #1a2b55; }

        .external-btn { background: var(--sirius-gold); color: #000; border: none; }
        .external-btn:hover { background: #e6b800; }

        .share-x-btn { background: #000000; color: #ffffff; border-color: #333; }
        .share-x-btn:hover { background: #111; }
        .share-x-btn i { font-size: 0.85rem; }

        .players-grid { display: grid; grid-template-columns: 1fr; gap: 0.8rem; width: 100%; }
        @media (min-width: 640px) {
            .players-grid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; }
        }
        .player-card { 
            background: var(--card-bg); 
            border: 1px solid var(--card-border); 
            border-radius: 12px; 
            padding: 0.9rem; 
            width: 100%;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }
        .player-card:active { border-color: var(--sirius-gold); transform: scale(0.99); }
        .player-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .player-avatar { 
            width: 40px; 
            height: 40px; 
            background: #10204a; 
            border: 2px solid var(--sirius-gold); 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: var(--sirius-gold); 
            font-size: 0.9rem;
            overflow: hidden;
            flex-shrink: 0;
        }
        .player-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .studs { width: 1.75em; height: 1.75em; fill: var(--sirius-gold); flex-shrink: 0; }
        .empty-state { grid-column: 1 / -1; text-align: center; padding: 2.5rem 1rem; background: var(--card-bg); border: 1px dashed var(--card-border); border-radius: 12px; color: var(--text-muted); font-size: 0.85rem; }
    </style>
</head>

        const masterPlayers = [

        const MATCH_FEED_URL = "matches.json";
        let playersData = [];
        let feedState = "loading";
        let feedError = "";

        function normalizeMatch(raw) {
            return {
                matchId: raw.matchId || "",
                player: raw.playerName || raw.player || "",
                team: raw.playerTeam || raw.team || "",
                playerId: String(raw.playerId || ""),
                track: raw.track || "utland",
                trackName: raw.trackName || "",
                pos: raw.position || raw.pos || "",
                league: raw.leagueName || raw.league || "",
                matchDate: String(raw.matchDate || raw.date || "").slice(0, 10),
                kickoff: raw.kickoff || "00:00",
                teamOnly: !!raw.teamOnly,
                home: raw.homeTeam || raw.home || "",
                away: raw.awayTeam || raw.away || "",
                scoreHome: raw.scoreHome ?? raw.homeScore ?? raw.homeGoals ?? null,
                scoreAway: raw.scoreAway ?? raw.awayScore ?? raw.awayGoals ?? null,
                status: raw.status || "Okänd status",
                rating: raw.rating ?? null,
                mins: raw.minutesPlayed ?? raw.mins ?? null,
                goals: raw.goals ?? null,
                ass: raw.assists ?? raw.ass ?? null,
                passes: raw.passes || null,
                chances: raw.chancesCreated ?? raw.chances ?? null,
                bigChances: raw.bigChancesCreated ?? raw.bigChances ?? null,
                shotsTarget: raw.shotsOnTarget ?? raw.shotsTarget ?? null,
                touches: raw.touches ?? null,
                photo: raw.photo || "",
                matchUrl: raw.matchUrl || ""
            };
        }

        async function loadMatchFeed() {
            if (!MATCH_FEED_URL) {
                feedState = "unconfigured";
                feedError = "Matchdatakällan är inte konfigurerad.";
                renderContent();
                return;
            }
            feedState = "loading";
            renderContent();
            try {
                const response = await fetch(MATCH_FEED_URL, {
                    headers: { "Accept": "application/json" },
                    cache: "no-store"
                });
                if (!response.ok) throw new Error("Datakällan svarade HTTP " + response.status);
                const payload = await response.json();
                const rows = Array.isArray(payload) ? payload : payload.matches;
                if (!Array.isArray(rows)) throw new Error("JSON måste innehålla en matches-lista.");
                playersData = rows.map(normalizeMatch).filter(m =>
                    m.player && m.home && m.away && m.matchDate
                );
                feedState = "ready";
                feedError = "";
            } catch (error) {
                feedState = "error";
                feedError = "Kunde inte hämta matchdata från matches.json.";
                console.error("Blåsvarta Spår matchfeed:", error);
            }
            renderContent();
        }

        function displayResult(value) {
            if (value === null || value === undefined || value === "" || value === "-") return "–";
            const s = String(value).trim();
            if (s === "" || s === "-" || s.toLowerCase() === "null" || s.toLowerCase() === "undefined") return "–";
            return s;
        }

        function displayStat(value, suffix = "") {
            return value === null || value === undefined || value === "" || value === "-" ? "–" : `${value}${suffix}`;
        }

        function buildDatePicker() {
            const container = document.getElementById('date-container');
            container.innerHTML = "";
            const center = addDays(todayStr, dateOffset);
            for (let i = -2; i <= 2; i++) {
                const iso = addDays(center, i);
                let label;
                if (iso === todayStr) label = "Idag";
                else if (iso === addDays(todayStr, -1)) label = "Igår";
                else if (iso === addDays(todayStr, 1)) label = "Imorgon";
                else label = `${new Date(iso + 'T12:00:00Z').toLocaleDateString('sv-SE', { weekday: 'short', timeZone: 'UTC' })} ${iso.slice(8)}`;
                const btn = document.createElement('button');
                btn.className = `date-item ${iso === selectedDate ? 'active' : ''}`;
                btn.textContent = label;
                btn.onclick = () => { selectedDate = iso; matchSearchQuery = ''; buildDatePicker(); renderContent(); };
                container.appendChild(btn);
            }
        }

        let swipeJustHappened = false;
        function setupDateSwipe() {
            const el = document.getElementById('date-container');
            if (!el) return;
            const STEP_PX = 56;
            let startX = null, moved = false, pid = null;
            el.addEventListener('pointerdown', (e) => {
                startX = e.clientX; moved = false; pid = e.pointerId;
            });
            el.addEventListener('pointermove', (e) => {
                if (startX === null || e.pointerId !== pid) return;
                const dx = e.clientX - startX;
                if (Math.abs(dx) < STEP_PX) return;
                const steps = Math.trunc(Math.abs(dx) / STEP_PX);
                const dir = dx > 0 ? -1 : 1;
                startX += Math.sign(dx) * steps * STEP_PX;
                moved = true;
                shiftDates(dir * steps);
            });
            const end = () => {
                if (moved) { swipeJustHappened = true; setTimeout(() => { swipeJustHappened = false; }, 60); }
                startX = null; moved = false; pid = null;
            };
            el.addEventListener('pointerup', end);
            el.addEventListener('pointercancel', end);
            el.addEventListener('click', (e) => { if (swipeJustHappened) { e.stopPropagation(); e.preventDefault(); } }, true);
        }
        window.addEventListener('load', setupDateSwipe);

        function shiftDates(n) {
            dateOffset += n;
            selectedDate = addDays(todayStr, dateOffset);
            matchSearchQuery = '';
            buildDatePicker();
            renderContent();
        }

        function goHome() {
            closeModal();
            closeDropdown();
            todayStr = swedenToday();
            selectedDate = todayStr;
            dateOffset = 0;
            matchSearchQuery = '';
            isResultsSearchOpen = false;
            document.getElementById('search-container-inline').innerHTML = '';
            buildDatePicker();
            openResultsView();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function syncTrackButtons() {
            document.querySelectorAll('.track-btn').forEach(b => b.classList.remove('active'));
            if (isResultsSearchOpen) document.getElementById('track-btn-search')?.classList.add('active');
            else document.getElementById(`track-btn-${selectedTrack}`)?.classList.add('active');
        }

        function openResultsView() {
            currentMode = 'results';
            document.getElementById('date-picker-bar').style.display = 'flex';
            document.getElementById('track-selector').style.display = 'grid';
            document.getElementById('view-title').textContent = matchSearchQuery ? `SÖKRESULTAT: "${matchSearchQuery}"` : "RESULTAT & KOMMANDE";
            document.getElementById('view-desc').textContent = matchSearchQuery ? "Visar spelare från alla spår" : "Tryck på en match för mer information";
            setActiveNav('nav-results');
            syncTrackButtons();
            renderResults();
        }

        function setTrack(track) {
            selectedTrack = track;
            if (isResultsSearchOpen) {
                isResultsSearchOpen = false;
                document.getElementById('search-container-inline').innerHTML = '';
                matchSearchQuery = '';
            }
            if (currentMode !== 'results') { openResultsView(); return; }
            syncTrackButtons();
            renderResults();
        }

        function normalizeText(t) {
            return String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        }

        function toggleResultsSearch() {
            closeDropdown();
            isResultsSearchOpen = !isResultsSearchOpen;
            const searchContainer = document.getElementById('search-container-inline');
            if (isResultsSearchOpen) {
                currentMode = 'results';
                searchContainer.innerHTML = `<div class="search-bar-inline"><input type="search" id="match-search-input" class="search-input" placeholder="Sök spelare (Utlandsspåret & Lånespåret)" autocomplete="off" aria-label="Sök spelare"></div>`;
                const input = document.getElementById('match-search-input');
                input.value = matchSearchQuery;
                input.addEventListener('input', (e) => {
                    matchSearchQuery = e.target.value;
                    renderResults();
                });
                input.focus();
            } else {
                searchContainer.innerHTML = '';
                matchSearchQuery = '';
                openResultsView();
            }
            syncTrackButtons();
        }

        function openSearchView() {
            closeDropdown();
            isResultsSearchOpen = false;
            document.getElementById('search-container-inline').innerHTML = '';
            currentMode = 'search';
            document.getElementById('date-picker-bar').style.display = 'none';
            document.getElementById('track-selector').style.display = 'grid';
            document.getElementById('view-title').textContent = "SÖK SPELARKORT";
            document.getElementById('view-desc').textContent = "Sök på spelare eller lag";
            setActiveNav('nav-sparen');
            syncTrackButtons();
            const area = document.getElementById('content-area');
            area.className = "";
            area.innerHTML = `<div class="search-bar-inline"><input type="search" id="player-search" class="search-input" placeholder="Sök spelare" autocomplete="off" aria-label="Sök spelarkort"></div><div id="search-results" class="players-grid"></div>`;
            const input = document.getElementById('player-search');
            input.addEventListener('input', () => renderSearchResults(input.value));
            renderSearchResults('');
            input.focus();
        }

        function renderSearchResults(query) {
            const q = normalizeText(query).trim();
            const list = masterPlayers.filter(p => !q || normalizeText([p.name, p.team, p.league, p.pos, p.trackName].join(' ')).includes(q));
            const target = document.getElementById('search-results');
            if (list.length === 0) {
                target.innerHTML = `<div class="empty-state"><p>Ingen spelare matchar "${query.replace(/[<>&"]/g, '')}".</p></div>`;
                return;
            }
            renderProfiles(null, list, target);
        }

        function toggleDropdown(e) {
            e.stopPropagation();
            const open = document.getElementById('spar-dropdown').classList.toggle('open');
            document.getElementById('nav-sparen').setAttribute('aria-expanded', open);
        }
        function closeDropdown() {
            document.getElementById('spar-dropdown').classList.remove('open');
            document.getElementById('nav-sparen').setAttribute('aria-expanded', 'false');
        }
        document.addEventListener('click', closeDropdown);
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDropdown(); });

        function selectTrackFromMenu(track) {
            closeDropdown();
            isResultsSearchOpen = false;
            document.getElementById('search-container-inline').innerHTML = '';
            currentMode = 'profiles';
            document.getElementById('date-picker-bar').style.display = 'none';
            document.getElementById('track-selector').style.display = 'none';
            
            if (track === 'sverige') {
                document.getElementById('view-title').textContent = "SVERIGESPÅRET";
                document.getElementById('view-desc').textContent = "Spelarkort";
                setActiveNav('nav-sparen');
                const area = document.getElementById('content-area');
                area.className = "";
                area.innerHTML = `<div class="empty-state"><p>Kommer senare</p></div>`;
                return;
            }

            document.getElementById('view-title').textContent = track === 'lane' ? "LÅNESPÅRET" : "UTLANDSSPÅRET";
            document.getElementById('view-desc').textContent = "Spelarkort";
            setActiveNav('nav-sparen');
            renderProfiles(track);
        }

        function renderResults() {
            const area = document.getElementById('content-area');
            area.className = "matches-grid";
            area.innerHTML = "";

            if (feedState !== "ready") {
                area.innerHTML = `<div class="empty-state"><p>${feedState === "error" ? feedError : "Hämtar matchdata från matches.json..."}</p></div>`;
                return;
            }

            const q = normalizeText(matchSearchQuery).trim();

            const filtered = playersData.filter(m => {
                const matchTrack = (selectedTrack === 'all' || m.track === selectedTrack);
                if (q) {
                    return normalizeText([m.player, m.home, m.away, m.league, m.team].join(' ')).includes(q);
                }
                if (!matchTrack) return false;
                return m.matchDate === selectedDate;
            });

            if (filtered.length === 0) {
                area.innerHTML = `<div class="empty-state"><p>${q ? `Inga matcher hittades för "${matchSearchQuery}".` : 'Inga matcher för valt datum.'}</p></div>`;
                return;
            }

            const groupedMatches = {};
            filtered.forEach(m => {
                const key = m.matchId ? m.matchId : `${m.home}-${m.away}-${m.matchDate}`;
                if (!groupedMatches[key]) {
                    groupedMatches[key] = [];
                }
                groupedMatches[key].push(m);
            });

            const matchList = Object.values(groupedMatches);

            matchList.sort((a, b) => {
                const dateA = a[0].matchDate;
                const dateB = b[0].matchDate;
                if (dateA !== dateB) return dateA.localeCompare(dateB);

                const statusOrder = (status) => {
                    if (status.startsWith('Slut')) return 1;
                    if (status === 'Pågår') return 2;
                    if (status === 'Kommande') return 3;
                    return 4;
                };
                const statDiff = statusOrder(a[0].status) - statusOrder(b[0].status);
                if (statDiff !== 0) return statDiff;
                return (a[0].kickoff || "00:00").localeCompare(b[0].kickoff || "00:00");
            });

            matchList.forEach((group) => {
                const primaryMatch = group[0];
                const isUpcoming = primaryMatch.status === 'Kommande';
                
                const rawHome = displayResult(primaryMatch.scoreHome);
                const rawAway = displayResult(primaryMatch.scoreAway);
                const scoreHome = isUpcoming ? '' : (rawHome === '-' ? '–' : rawHome);
                const scoreAway = isUpcoming ? '' : (rawAway === '-' ? '–' : rawAway);

                const card = document.createElement('div');
                card.className = "match-card";
                card.onclick = () => openMatchStatsModalGroup(group, 0);

                let playersListHtml = '';
                group.forEach((m, idx) => {
                    const imgUrl = m.photo || (m.playerId ? `https://images.fotmob.com/image_resources/playerimages/${encodeURIComponent(m.playerId)}.png` : '');
                    const rating = displayStat(m.rating);
                    const mins = displayStat(m.mins, "'");
                    const goals = m.goals ?? 0;
                    const assists = m.ass ?? 0;

                    playersListHtml += `
                        <div class="player-footer clickable" onclick="event.stopPropagation(); openMatchStatsModalGroup(JSON.parse(this.dataset.group), ${idx})" data-group='${JSON.stringify(group).replace(/'/g, "&apos;")}'>
                            <div class="player-info-group">
                                <div class="player-thumb-wrapper">
                                    <img src="${imgUrl}" class="player-thumb" onerror="this.onerror=null; this.src='https://via.placeholder.com/30';">
                                    ${m.rating !== null && !isUpcoming ? `<span class="rating-badge">${rating}</span>` : ''}
                                </div>
                                <div class="player-details">
                                    <h4>${m.player}</h4>
                                </div>
                            </div>
                            <div class="player-quick-stats">${isUpcoming ? "" : (m.teamOnly ? "Spelade ej" : `${mins} | ${goals} MÅL ${assists} ASS`)}</div>
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div class="match-header">
                        <span>${primaryMatch.league || "Liga saknas"} ${q ? '· ' + primaryMatch.matchDate : ''}</span>
                        <span class="status-badge">${isUpcoming ? "Kommande" + (primaryMatch.kickoff ? " · " + primaryMatch.kickoff : "") : (primaryMatch.status || "Status saknas")}</span>
                    </div>
                    <div class="team-row"><span>${primaryMatch.home}</span><span class="team-score">${scoreHome}</span></div>
                    <div class="team-row"><span>${primaryMatch.away}</span><span class="team-score">${scoreAway}</span></div>
                    ${playersListHtml}
                `;
                area.appendChild(card);
            });
        }

        function renderProfiles(track, list, target) {
            const area = target || document.getElementById('content-area');
            if (!target) area.className = "players-grid";
            area.innerHTML = "";

            const filtered = list ? list.slice() : (track === 'all' ? masterPlayers : masterPlayers.filter(x => x.track === track));

            filtered.sort((a,b) => a.name.localeCompare(b.name, 'sv')).forEach(p => {
                const card = document.createElement('div');
                card.className = "player-card";
                card.onclick = () => openPlayerProfileModal(p);
                card.innerHTML = `
                    <div class="player-card-header">
                        <div class="player-avatar">
                            ${p.id ? `<img src="https://images.fotmob.com/image_resources/playerimages/${p.id}.png" alt="${p.name}" onerror="this.onerror=null; this.parentElement.innerHTML='<i class=\\'fa-solid fa-user\\'></i>';">` : `<i class="fa-solid fa-user"></i>`}
                        </div>
                        <div>
                            <h3 style="color:#fff; font-size:0.9rem;">${p.name}</h3>
                            <span style="color:var(--sirius-gold); font-size:0.75rem; font-weight:700;">${p.team}</span>
                        </div>
                    </div>
                    <div style="font-size:0.75rem; color:var(--text-muted); border-top: 1px solid var(--card-border); padding-top: 8px; margin-top: 8px;">
                        <p style="margin-bottom: 2px;"><strong>Liga:</strong> ${p.league}</p>
                        <p style="margin-bottom: 2px;"><strong>Position:</strong> ${p.pos || '-'}</p>
                        <p><strong>Ålder:</strong> ${p.age ? p.age + ' år' : '-'}</p>
                    </div>
                `;
                area.appendChild(card);
            });
        }

        function openUpcomingModal(p) {
            savedScrollPosition = window.scrollY;
            const avatarUrl = p.photo || (p.playerId ? `https://images.fotmob.com/image_resources/playerimages/${encodeURIComponent(p.playerId)}.png` : '');
            const stat = (label, value) => `<div class="stat-item"><span>${label}</span><strong>${value || ''}</strong></div>`;
            document.getElementById('modal-body-content').innerHTML = `
                <div class="modal-player-header">
                    <div class="modal-avatar-wrapper">
                        <img class="modal-avatar" src="${avatarUrl}" onerror="this.src='https://via.placeholder.com/60';">
                    </div>
                    <h3 style="color:#fff; font-size:1rem; font-weight:900;">${p.player}</h3>
                    <p style="color:var(--sirius-gold); font-size:0.8rem; font-weight:700;">${p.team}</p>
                </div>
                <div class="modal-section-title">${p.teamOnly ? 'Spelade ej' : 'Kommande match'}</div>
                <div class="modal-stats-list">
                    ${stat('Datum', p.matchDate)}
                    ${p.teamOnly ? stat('Resultat', displayResult(p.scoreHome) + ' – ' + displayResult(p.scoreAway)) : stat('Avspark (svensk tid)', p.kickoff)}
                    ${stat('Hemmalag', p.home)}
                    ${stat('Bortalag', p.away)}
                    ${stat('Tävling', p.league)}
                </div>
                ${p.matchUrl ? `<a href="${p.matchUrl}" target="_blank" class="external-btn"><i class="fa-solid fa-arrow-up-right-from-square"></i> Se matchen på FotMob</a>` : ''}
            `;
            { const mc = document.querySelector('#stats-modal .modal-content'); if (mc) mc.scrollTop = 0; } 
            document.getElementById('stats-modal').classList.add('active');
            document.documentElement.classList.add('modal-open');
            document.body.classList.add('modal-open');
        }

        function openMatchStatsModalGroup(group, index = 0) {
            const p = group[index];
            if (p.status === 'Kommande' || p.teamOnly) { openUpcomingModal(p); return; }
            savedScrollPosition = window.scrollY;
            const avatarUrl = p.photo || (p.playerId ? `https://images.fotmob.com/image_resources/playerimages/${encodeURIComponent(p.playerId)}.png` : '');
            const stat = (label, value, suffix = "") =>
                `<div class="stat-item"><span>${label}</span><strong>${displayStat(value, suffix)}</strong></div>`;

            let navButtonHtml = '';
            if (group.length > 1) {
                const nextIdx = (index + 1) % group.length;
                navButtonHtml = `
                    <button class="nav-player-btn" onclick="openMatchStatsModalGroup(${JSON.stringify(group).replace(/"/g, '&quot;')}, ${nextIdx})">
                        Nästa spelare (${group[nextIdx].player}) <i class="fa-solid fa-arrow-right"></i>
                    </button>
                `;
            }

            const rawH = displayResult(p.scoreHome);
            const rawA = displayResult(p.scoreAway);
            const resH = rawH === '-' ? '–' : rawH;
            const resA = rawA === '-' ? '–' : rawA;

            const xShareText = encodeURIComponent(
                `📊 BLÅSVARTA SPÅR\n\n` +
                `${p.player} (${p.team})\n` +
                `📅 ${p.matchDate} | ${p.league}\n` +
                `⚽ ${p.home} - ${p.away} ${resH}-${resA}\n` +
                `⭐ Betyg: ${displayStat(p.rating)}\n` +
                `⏱️ Minuter: ${displayStat(p.mins, "'")}\n` +
                `🎯 Mål: ${p.goals ?? 0} | Ass: ${p.ass ?? 0}\n` +
                `📈 Chanser: ${displayStat(p.chances)}`
            );
            const xShareUrl = `https://twitter.com/intent/tweet?text=${xShareText}`;

            document.getElementById('modal-body-content').innerHTML = `
                <div class="modal-player-header">
                    <div class="modal-avatar-wrapper">
                        <img class="modal-avatar" src="${avatarUrl}" onerror="this.src='https://via.placeholder.com/60';">
                        ${p.rating !== null ? `<span class="modal-rating-badge">${displayStat(p.rating)}</span>` : ''}
                    </div>
                    <h3 style="color:#fff; font-size:1rem; font-weight:900;">${p.player}</h3>
                    <p style="color:var(--sirius-gold); font-size:0.8rem; font-weight:700;">${p.team} ${p.pos ? '(' + p.pos + ')' : ''}</p>
                    <p style="color:var(--text-muted); font-size:0.72rem; margin-top:4px;">${p.matchDate} · ${p.league}</p>
                </div>
                <div class="modal-section-title">Matchstatistik</div>
                <div class="modal-stats-list">
                    ${stat("Slutresultat", `${resH} –${resA}`)}
                    ${stat("Spelade minuter", p.mins, p.mins === null ? "" : "'")}
                    ${stat("Mål", p.goals)}
                    ${stat("Assister", p.ass)}
                    ${stat("Spelarbetyg", p.rating)}
                    ${stat("Precisa passningar", p.passes)}
                    ${stat("Skapade chanser", p.chances)}
                </div>
                ${p.matchUrl ? `<a href="${p.matchUrl}" target="_blank" class="external-btn"><i class="fa-solid fa-arrow-up-right-from-square"></i> Se matchen på FotMob</a>` : ''}
                <a href="${xShareUrl}" target="_blank" class="share-x-btn"><i class="fa-brands fa-x-twitter"></i> Dela på X</a>
                ${navButtonHtml}`;
            { const mc = document.querySelector('#stats-modal .modal-content'); if (mc) mc.scrollTop = 0; } 
            document.getElementById('stats-modal').classList.add('active');
            document.documentElement.classList.add('modal-open');
            document.body.classList.add('modal-open');
        }

        function openPlayerProfileModal(p) {
            savedScrollPosition = window.scrollY;
            const avatarUrl = p.id ? `https://images.fotmob.com/image_resources/playerimages/${p.id}.png` : '';
            document.getElementById('modal-body-content').innerHTML = `
                <div class="modal-player-header">
                    <div class="modal-avatar-wrapper">
                        <img class="modal-avatar" src="${avatarUrl}" onerror="this.src='https://via.placeholder.com/60';">
                    </div>
                    <h3 style="color:#fff; font-size:1.1rem; font-weight:900;">${p.name}</h3>
                    <p style="color:var(--sirius-gold); font-size:0.8rem; font-weight:700;">${p.team} • ${p.league}</p>
                </div>
                <div class="modal-section-title">Spelarkort</div>
                <div class="modal-stats-list">
                    <div class="stat-item"><span>Ålder</span><strong>${p.age ? p.age + ' år' : '-'}</strong></div>
                    <div class="stat-item"><span>Position</span><strong>${p.pos || '-'}</strong></div>
                    <div class="stat-item"><span>Kontrakt till</span><strong>${p.contract && p.contract !== '-' ? p.contract : '-'}</strong></div>
                    <div class="stat-item"><span>Nationalitet</span><strong>${p.nat || '-'}</strong></div>
                </div>
                <a href="${p.fotmobUrl}" target="_blank" class="external-btn">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i> Se live-stats på FotMob
                </a>`;
            { const mc = document.querySelector('#stats-modal .modal-content'); if (mc) mc.scrollTop = 0; } 
            document.getElementById('stats-modal').classList.add('active');
            document.documentElement.classList.add('modal-open');
            document.body.classList.add('modal-open');
        }

        function closeModal(e) {
            document.getElementById('stats-modal').classList.remove('active');
            document.documentElement.classList.remove('modal-open');
            document.body.classList.remove('modal-open');
            window.scrollTo(0, savedScrollPosition);
        }

        function renderContent() { if (currentMode === 'results') renderResults(); }
        function setActiveNav(navId) { document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active')); document.getElementById(navId)?.classList.add('active'); }

        window.onload = () => { goHome(); loadMatchFeed(); };
    </script>
</body>
</html>
