name: Uppdatera matcher
on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update_matches.py
      - run: |
          git config user.name "matchbot"
          git config user.email "matchbot@users.noreply.github.com"
          git add matches.json
          git diff --staged --quiet || git commit -m "Uppdatera matches.json"
          git push
