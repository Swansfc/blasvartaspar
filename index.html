<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sirius Proffs V2</title>
<style>
body{font-family:Arial,sans-serif;background:#0f172a;color:#fff;margin:0;padding:20px}
.card{background:#1e293b;padding:15px;border-radius:12px;margin:10px 0}
.small{color:#94a3b8}
</style>
</head>
<body>
<h1>Sirius Proffs V2</h1>
<div id="results"></div>
<script>
const masterPlayers=[
{name:'Kerim Mrabti',team:'AEK Larnaca',teamId:'133604'},
{name:'Herman Sjögrell',team:'FC Inter Turku',teamId:'134437'},
{name:'Aron Bjarnason',team:'Breidablik',teamId:'134529'},
{name:'Wessam Abou Ali',team:'Columbus Crew',teamId:'134781'},
{name:'Jamie Roche',team:'Kortrijk',teamId:'134739'},
{name:'Jesper Nyholm',team:'Muangthong United',teamId:'135532'}
];

async function loadLiveResults(){
 const wrap=document.getElementById('results');
 wrap.innerHTML='Laddar...';
 let html='';
 for(const p of masterPlayers){
  try{
   const r=await fetch(`https://www.thesportsdb.com/api/v1/json/3/eventslast.php?id=${p.teamId}`);
   const d=await r.json();
   const m=d.results?.[0];
   html+=`<div class="card"><h3>${p.name}</h3><div>${p.team}</div>${m?`<p>${m.strHomeTeam} ${m.intHomeScore} - ${m.intAwayScore} ${m.strAwayTeam}</p><div class="small">${m.dateEvent}</div>`:'<p>Ingen data</p>'}</div>`;
  }catch(e){html+=`<div class="card"><h3>${p.name}</h3><p>Fel vid hämtning</p></div>`}
 }
 wrap.innerHTML=html;
}
loadLiveResults();
setInterval(loadLiveResults,1800000);
</script>
</body>
</html>
